<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="styles.css">
   <title>Simon Says</title>
</head>
<body>
   <div id="menu">
       <h1>Simon Says</h1>
       <input type="text" id="username" placeholder="Ingresa tu nombre" />
       <button id="start">Start Game</button>
       <button id="showVictories">Show Victories</button>
   </div>
   <div id="game" style="display:none;">
       <div class="button-container">
           <div class="color-button" id="red"></div>
           <div class="color-button" id="green"></div>
           <div class="color-button" id="blue"></div>
           <div class="color-button" id="yellow"></div>
       </div>
       <button id="restart">Reiniciar Juego</button> <!-- Solo botón de reinicio -->
       <div id="score">Puntuación: 0</div>
   </div>
   <script src="script.js"></script>
</body>
</html>
